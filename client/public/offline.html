<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <title>Offline · P.D.O Classes</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        max-width: 440px;
        width: 100%;
        padding: 32px 24px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 9999px;
        background: rgba(37, 99, 235, 0.2);
        color: #60a5fa;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        margin-bottom: 8px;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #2563eb;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: background 0.2s;
        width: 100%;
      }
      .btn:hover {
        background: #1d4ed8;
      }
      .footer {
        margin-top: 16px;
        font-size: 12px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">Offline Mode</span>
      <h1>You're currently offline</h1>
      <p>
        P.D.O Classes requires an internet connection to sync student attendance and load fresh classroom updates.
        Please check your connection and try again.
      </p>
      <button class="btn" onclick="window.location.reload()">Retry Connection</button>
      <div class="footer">P.D.O Classes · Lalpur, Ranchi</div>
    </div>
  </body>
</html>
