databases:
  - name: pdo-classes-db
    databaseName: pdo_classes
    user: pdo_admin
    plan: free

services:
  - type: web
    name: pdo-classes-platform
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: pdo-classes-db
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://pdo-classes-platform.onrender.com
      - key: VITE_API_BASE_URL
        value: https://pdo-classes-platform.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ALLOW_MOCK_WHATSAPP
        value: "true"
      - key: WHATSAPP_MOCK_MODE
        value: "true"
