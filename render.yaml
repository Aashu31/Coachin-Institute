services:
  - type: web
    name: pdo-classes-platform
    env: node
    plan: free
    buildCommand: |
      cd server && npm install
      cd ../client && npm install
      cd ../client && npm run build
    startCommand: |
      cd server && npm run start
    # The Express server runs on port 4000
    # Render automatically assigns a port, but our app uses 4000
    # We need to map Render's port to 4000
    # Or we can make the server listen on $PORT
    envVars:
      DATABASE_URL: postgres:///pdo_classes
      NODE_ENV: production
      VITE_API_BASE_URL: https://pdo-classes-platform.onrender.com
      # JWT secrets etc. would go here

  # Alternative: separate frontend service
  # - type: static
  #   name: pdo-client
  #   env: vite
  #   plan: free
  #   buildCommand: npm run build --workspace @pdo/client
  #   publishDir: client/dist
  #   envVars:
  #     VITE_API_BASE_URL: https://pdo-classes-platform-api.onrender.com